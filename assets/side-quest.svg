<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c24b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ main quest window ══════════ -->
  <g filter="url(#shadow)">
    <rect x="36" y="28" width="560" height="252" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <circle cx="58" cy="50" r="5.5" fill="#ff5f56"/>
  <circle cx="76" cy="50" r="5.5" fill="#ffbd2e"/>
  <circle cx="94" cy="50" r="5.5" fill="#27c93f"/>
  <text x="316" y="54" text-anchor="middle" font-size="11.5" fill="#8b949e">litefs — the main quest</text>
  <line x1="36" y1="66" x2="596" y2="66" stroke="#262b33"/>

  <text x="64" y="96" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> how does litefs replicate?</text>

  <text x="64" y="126" fill="#c9d1d9">LiteFS replicates at the filesystem level:</text>

  <!-- highlighted excerpt (the moment you branch on) -->
  <rect x="147" y="134" width="246" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <rect x="62" y="156" width="153" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="64" y="148" fill="#c9d1d9" textLength="78">it keeps a</text>
  <text x="149.8" y="148" fill="#f5c24b" textLength="241.8">copy-on-write B-tree so writers</text>
  <text x="64" y="170" fill="#f5c24b" textLength="148.2">never block readers</text>
  <text x="212.2" y="170" fill="#c9d1d9" textLength="171.6">, shipping dirty pages</text>
  <text x="64" y="192" fill="#c9d1d9">to replicas behind a lease-held primary…</text>

  <!-- RPG quest marker -->
  <g>
    <text x="410" y="151" font-size="17" font-weight="bold" fill="#f5c24b" text-anchor="middle">!</text>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1; .4 0 .6 1"/>
  </g>

  <!-- the main plot rolls on, untouched -->
  <text x="64" y="240" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> and how do lease failovers work?</text>
  <rect x="337" y="228" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════ the branch ══════════ -->
  <path d="M 216 186 C 216 290, 280 340, 382 368" fill="none" stroke="#f5c24b" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="203" y="291" width="116" height="28" rx="6" fill="#1d212a" stroke="#f5c24b" stroke-opacity="0.55"/>
  <text x="261" y="309" text-anchor="middle" fill="#f5c24b">prefix + B</text>

  <!-- ══════════ side quest window ══════════ -->
  <g filter="url(#shadow)">
    <rect x="340" y="372" width="470" height="182" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <!-- banner ribbon -->
  <polygon points="373,362 397,362 397,384 373,384 384,373" fill="#c9a227"/>
  <polygon points="727,362 703,362 703,384 727,384 716,373" fill="#c9a227"/>
  <rect x="395" y="356" width="310" height="32" rx="5" fill="#f5c24b"/>
  <text x="550" y="377" text-anchor="middle" font-weight="bold" font-size="13.5" letter-spacing="1" fill="#1c1710">◆ SIDE QUEST ACCEPTED ◆</text>

  <text x="368" y="424" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> Re</text>
  <text x="407" y="424" fill="#f5c24b" textLength="296.4">"copy-on-write B-tree so writers never</text>
  <text x="383.6" y="446" fill="#f5c24b" textLength="109.2">block readers"</text>
  <text x="492.8" y="446" fill="#c9d1d9" textLength="163.8">: why does that avoid</text>
  <text x="383.6" y="468" fill="#c9d1d9">write locks?</text>

  <text x="368" y="506" fill="#6e7681">▸ a real fork — it carries the whole main-quest memory</text>
  <text x="368" y="528" fill="#6e7681">▸ finish it, delete it — nothing flows back upstream</text>

  <!-- footer -->
  <text x="440" y="596" text-anchor="middle" fill="#8b949e" font-size="12.5">no merge — diverge, explore, delete. the main quest never knew.</text>
</svg>
