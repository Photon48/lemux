<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" font-family="SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ the tree popup ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="28" width="760" height="354" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <text x="440" y="54" text-anchor="middle" font-size="11.5" fill="#8b949e">assay results — the side-quest tree (prefix + T)</text>
  <line x1="60" y1="66" x2="820" y2="66" stroke="#262b33"/>
  <line x1="402" y1="80" x2="402" y2="368" stroke="#2d333e"/>

  <!-- fzf chrome: prompt, match count, keys -->
  <text x="88" y="96"><tspan fill="#7ee787">lemux&gt;</tspan></text>
  <rect x="142.6" y="84" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="88" y="118" fill="#8b949e" opacity="0.7">4/4</text>
  <text x="88" y="140" fill="#8b949e">enter: jump · ctrl-x: delete · esc: close</text>

  <!-- the selection, hopping between two side quests -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 22" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <rect x="72" y="173" width="316" height="21" rx="4" fill="#f5c24b" opacity="0.10"/>
    <text x="74" y="188" fill="#f5c24b" font-weight="bold">▌</text>
  </g>

  <!-- the tree -->
  <text x="88.0" y="166" fill="#c9d1d9">●</text>
  <text x="103.6" y="166" fill="#c9d1d9" textLength="101.4">assay results</text>
  <text x="88.0" y="188" fill="#8b949e">├</text>
  <text x="95.8" y="188" fill="#8b949e">─</text>
  <text x="111.4" y="188" fill="#c9d1d9">●</text>
  <text x="127.0" y="188" fill="#c9d1d9" textLength="124.8">unequal variance</text>
  <text x="88.0" y="210" fill="#8b949e">│</text>
  <text x="111.4" y="210" fill="#8b949e">└</text>
  <text x="119.2" y="210" fill="#8b949e">─</text>
  <text x="134.8" y="210" fill="#8b949e">○</text>
  <text x="150.4" y="210" fill="#c9d1d9" textLength="93.6">borderline p</text>
  <text x="88.0" y="232" fill="#8b949e">└</text>
  <text x="95.8" y="232" fill="#8b949e">─</text>
  <text x="111.4" y="232" fill="#8b949e">○</text>
  <text x="127.0" y="232" fill="#c9d1d9" textLength="109.2">power analysis</text>

  <!-- the preview: each branch's story, swapping with the selection -->
  <g>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  <text x="424.0" y="96" font-weight="bold" fill="#c9d1d9" textLength="124.8">unequal variance</text>
  <text x="564.4" y="96" fill="#c9d1d9" textLength="46.8">● idle</text>
  <text x="619.0" y="96" fill="#8b949e" textLength="148.2">· 6m ago · 1 branch</text>
  <text x="424.0" y="124" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ story so far ┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="146" fill="#f5c24b">⑂</text>
  <text x="439.6" y="146" fill="#c9d1d9" textLength="319.8">testing whether the significance survives</text>
  <text x="439.6" y="168" fill="#c9d1d9" textLength="288.6">once the equal-variance assumption is</text>
  <text x="439.6" y="190" fill="#c9d1d9" textLength="54.6">dropped</text>
  <text x="424.0" y="216" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ branched on ┄┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="238" fill="#f5c24b">❝</text>
  <text x="439.6" y="238" fill="#8b949e" textLength="304.2">p = 0.03 on a two-sample t-test, so yes</text>
  <text x="439.6" y="260" fill="#8b949e" textLength="93.6">at α = 0.05.</text>
  <rect x="539.0" y="246" width="191.2" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="541.0" y="260" fill="#f5c24b" textLength="187.2">Your groups have unequal</text>
  <rect x="437.6" y="268" width="121.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="439.6" y="282" fill="#f5c24b" textLength="117.0">variance though</text>
  <text x="556.6" y="282" fill="#8b949e" textLength="195.0">, which that test assumes</text>
  <text x="439.6" y="304" fill="#8b949e" textLength="39.0">away…</text>
  <text x="424.0" y="330" font-weight="bold" fill="#39c5cf">❯</text>
  <text x="439.6" y="330" fill="#8b949e">asked</text>
  <text x="494.2" y="330" fill="#c9d1d9" textLength="218.4">does that change the result?</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  <text x="424.0" y="96" font-weight="bold" fill="#c9d1d9" textLength="93.6">borderline p</text>
  <text x="533.2" y="96" fill="#8b949e" textLength="140.4">○ closed · 40m ago</text>
  <text x="424.0" y="124" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ story so far ┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="146" fill="#f5c24b">⑂</text>
  <text x="439.6" y="146" fill="#8b949e" textLength="319.8">testing whether the significance survives</text>
  <text x="439.6" y="168" fill="#8b949e" textLength="288.6">once the equal-variance assumption is</text>
  <text x="439.6" y="190" fill="#8b949e" textLength="54.6">dropped</text>
  <text x="431.8" y="216" fill="#f5c24b">⑂</text>
  <text x="447.4" y="216" fill="#c9d1d9" textLength="312.0">weighing what a p of 0.06 says about the</text>
  <text x="447.4" y="238" fill="#c9d1d9" textLength="171.6">treatment effect claim</text>
  <text x="424.0" y="264" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ branched on ┄┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="286" fill="#f5c24b">❝</text>
  <text x="439.6" y="286" fill="#8b949e" textLength="304.2">Welch's t-test drops the equal-variance</text>
  <text x="439.6" y="308" fill="#8b949e" textLength="241.8">assumption. Re-run on your data</text>
  <rect x="687.2" y="294" width="66.4" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="689.2" y="308" fill="#f5c24b" textLength="62.4">it gives</text>
  <rect x="437.6" y="316" width="66.4" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="439.6" y="330" fill="#f5c24b" textLength="62.4">p = 0.06</text>
  <text x="502.0" y="330" fill="#8b949e" textLength="195.0">, so the effect no longer</text>
  <text x="424.0" y="356" font-weight="bold" fill="#39c5cf">❯</text>
  <text x="439.6" y="356" fill="#8b949e">asked</text>
  <text x="494.2" y="356" fill="#c9d1d9" textLength="226.2">so is the effect real or not?</text>
  </g>
</svg>
