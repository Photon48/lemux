<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" font-family="SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c24b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ the main conversation ══════════ -->
  <g filter="url(#shadow)">
    <rect x="36" y="28" width="560" height="230" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <circle cx="58" cy="50" r="5.5" fill="#ff5f56"/>
  <circle cx="76" cy="50" r="5.5" fill="#ffbd2e"/>
  <circle cx="94" cy="50" r="5.5" fill="#27c93f"/>
  <text x="316" y="54" text-anchor="middle" font-size="11.5" fill="#8b949e">assay results — the main quest</text>
  <line x1="36" y1="66" x2="596" y2="66" stroke="#262b33"/>

  <text x="64" y="96" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> is the treatment effect significant?</text>

  <text x="64.0" y="126" fill="#c9d1d9" textLength="358.8">p = 0.03 on a two-sample t-test, so yes at α =</text>
  <text x="64.0" y="148" fill="#c9d1d9" textLength="39.0">0.05.</text>
  <rect x="108.8" y="134" width="261.4" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="110.8" y="148" fill="#f5c24b" textLength="257.4">Your groups have unequal variance</text>
  <rect x="62.0" y="156" width="50.8" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="64.0" y="170" fill="#f5c24b" textLength="46.8">though</text>
  <text x="110.8" y="170" fill="#c9d1d9" textLength="241.8">, which that test assumes away…</text>

  <!-- the aside worth chasing -->
  <g>
    <text x="387" y="151" font-size="17" font-weight="bold" fill="#f5c24b" text-anchor="middle">!</text>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1; .4 0 .6 1"/>
  </g>

  <!-- …and the main thread carries on regardless -->
  <text x="64" y="218" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> good — now plot the effect sizes</text>
  <rect x="337" y="206" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════ the branch ══════════ -->
  <path d="M 87 186 C 87 290, 151 318, 382 346" fill="none" stroke="#f5c24b" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="96" y="280" width="104" height="28" rx="6" fill="#1d212a" stroke="#f5c24b" stroke-opacity="0.55"/>
  <text x="148" y="298" text-anchor="middle" fill="#f5c24b">branch it</text>

  <!-- ══════════ the side quest ══════════ -->
  <g filter="url(#shadow)">
    <rect x="340" y="350" width="470" height="196" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <polygon points="373,340 397,340 397,362 373,362 384,351" fill="#c9a227"/>
  <polygon points="727,340 703,340 703,362 727,362 716,351" fill="#c9a227"/>
  <rect x="395" y="334" width="310" height="32" rx="5" fill="#f5c24b"/>
  <text x="550" y="355" text-anchor="middle" font-weight="bold" font-size="13.5" letter-spacing="1" fill="#1c1710">◆ SIDE QUEST ACCEPTED ◆</text>

  <text x="368" y="402" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan></text>
  <text x="383.6" y="402" fill="#c9d1d9" textLength="15.6">Re</text>
  <rect x="405.0" y="388" width="269.2" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="407.0" y="402" fill="#f5c24b" textLength="265.2">"Your groups have unequal variance</text>
  <rect x="381.6" y="410" width="58.6" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="383.6" y="424" fill="#f5c24b" textLength="54.6">though"</text>
  <text x="438.2" y="424" fill="#c9d1d9" textLength="234.0">: does that change the result?</text>

  <text x="368.0" y="468" fill="#8b949e" textLength="304.2">Welch's t-test drops the equal-variance</text>
  <text x="368.0" y="490" fill="#8b949e" textLength="343.2">assumption. Re-run on your data it gives p =</text>
  <text x="368.0" y="512" fill="#8b949e" textLength="226.2">0.06, so the effect no longer</text>
  <rect x="600" y="500" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
