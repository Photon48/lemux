<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" font-family="SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ the tree popup ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="28" width="760" height="354" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <text x="440" y="54" text-anchor="middle" font-size="11.5" fill="#8b949e">checkout page — the side-quest tree (prefix + T)</text>
  <line x1="60" y1="66" x2="820" y2="66" stroke="#262b33"/>
  <line x1="402" y1="80" x2="402" y2="368" stroke="#2d333e"/>

  <!-- fzf chrome: prompt, match count, keys -->
  <text x="88" y="96"><tspan fill="#7ee787">lemux&gt;</tspan></text>
  <rect x="142.6" y="84" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="88" y="118" fill="#8b949e" opacity="0.7">4/4</text>
  <text x="88" y="140" fill="#8b949e">enter: jump · ctrl-x: delete · esc: close</text>

  <!-- the selection, hopping between two side quests -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 22" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <rect x="72" y="173" width="316" height="21" rx="4" fill="#f5c24b" opacity="0.10"/>
    <text x="74" y="188" fill="#f5c24b" font-weight="bold">▌</text>
  </g>

  <!-- the tree -->
  <text x="88.0" y="166" fill="#c9d1d9">●</text>
  <text x="103.6" y="166" fill="#c9d1d9" textLength="101.4">checkout page</text>
  <text x="88.0" y="188" fill="#8b949e">├</text>
  <text x="95.8" y="188" fill="#8b949e">─</text>
  <text x="111.4" y="188" fill="#c9d1d9">●</text>
  <text x="127.0" y="188" fill="#c9d1d9" textLength="109.2">font swap jump</text>
  <text x="88.0" y="210" fill="#8b949e">│</text>
  <text x="111.4" y="210" fill="#8b949e">└</text>
  <text x="119.2" y="210" fill="#8b949e">─</text>
  <text x="134.8" y="210" fill="#8b949e">○</text>
  <text x="150.4" y="210" fill="#c9d1d9" textLength="101.4">fallback font</text>
  <text x="88.0" y="232" fill="#8b949e">└</text>
  <text x="95.8" y="232" fill="#8b949e">─</text>
  <text x="111.4" y="232" fill="#8b949e">○</text>
  <text x="127.0" y="232" fill="#c9d1d9" textLength="117.0">font subsetting</text>

  <!-- the preview: each branch's story, swapping with the selection -->
  <g>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  <text x="424.0" y="96" font-weight="bold" fill="#c9d1d9" textLength="109.2">font swap jump</text>
  <text x="548.8" y="96" fill="#c9d1d9" textLength="46.8">● idle</text>
  <text x="603.4" y="96" fill="#8b949e" textLength="148.2">· 4m ago · 1 branch</text>
  <text x="424.0" y="124" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ story so far ┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="146" fill="#f5c24b">⑂</text>
  <text x="439.6" y="146" fill="#c9d1d9" textLength="304.2">digging into the second layout jump the</text>
  <text x="439.6" y="168" fill="#c9d1d9" textLength="312.0">webfont swap causes and what can stop it</text>
  <text x="424.0" y="194" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ branched on ┄┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="216" fill="#f5c24b">❝</text>
  <text x="439.6" y="216" fill="#8b949e" textLength="304.2">…images have no width or height, so the</text>
  <text x="439.6" y="238" fill="#8b949e" textLength="218.4">browser can't reserve space.</text>
  <rect x="663.8" y="224" width="89.8" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="665.8" y="238" fill="#f5c24b" textLength="85.8">The webfont</text>
  <rect x="437.6" y="246" width="199.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="439.6" y="260" fill="#f5c24b" textLength="195.0">swap causes a second jump</text>
  <text x="642.4" y="260" fill="#8b949e" textLength="78.0">— that one</text>
  <text x="439.6" y="282" fill="#8b949e" textLength="171.6">needs a different fix…</text>
  <text x="424.0" y="308" font-weight="bold" fill="#39c5cf">❯</text>
  <text x="439.6" y="308" fill="#8b949e">asked</text>
  <text x="494.2" y="308" fill="#c9d1d9" textLength="249.6">which fix, and what does it cost</text>
  <text x="494.2" y="330" fill="#c9d1d9" textLength="23.4">me?</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  <text x="424.0" y="96" font-weight="bold" fill="#c9d1d9" textLength="101.4">fallback font</text>
  <text x="541.0" y="96" fill="#8b949e" textLength="140.4">○ closed · 30m ago</text>
  <text x="424.0" y="124" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ story so far ┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="146" fill="#f5c24b">⑂</text>
  <text x="439.6" y="146" fill="#8b949e" textLength="304.2">digging into the second layout jump the</text>
  <text x="439.6" y="168" fill="#8b949e" textLength="312.0">webfont swap causes and what can stop it</text>
  <text x="431.8" y="194" fill="#f5c24b">⑂</text>
  <text x="447.4" y="194" fill="#c9d1d9" textLength="280.8">measuring how many real visits would</text>
  <text x="447.4" y="216" fill="#c9d1d9" textLength="249.6">ever see the fallback font stick</text>
  <text x="424.0" y="242" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ branched on ┄┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="264" fill="#f5c24b">❝</text>
  <text x="439.6" y="264" fill="#8b949e" textLength="304.2">font-display: optional. The tradeoff is</text>
  <text x="439.6" y="286" fill="#8b949e" textLength="31.2">that</text>
  <rect x="476.6" y="272" width="277.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="478.6" y="286" fill="#f5c24b" textLength="273.0">on a slow connection the webfont is</text>
  <rect x="437.6" y="294" width="128.8" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="439.6" y="308" fill="#f5c24b" textLength="124.8">skipped entirely</text>
  <text x="572.2" y="308" fill="#8b949e" textLength="109.2">for that visit</text>
  <text x="424.0" y="334" font-weight="bold" fill="#39c5cf">❯</text>
  <text x="439.6" y="334" fill="#8b949e">asked</text>
  <text x="494.2" y="334" fill="#c9d1d9" textLength="249.6">how many visits does that really</text>
  <text x="494.2" y="356" fill="#c9d1d9" textLength="54.6">affect?</text>
  </g>
</svg>
