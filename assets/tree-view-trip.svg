<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" font-family="SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ the tree popup ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="28" width="760" height="354" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <text x="440" y="54" text-anchor="middle" font-size="11.5" fill="#8b949e">japan trip — the side-quest tree (prefix + T)</text>
  <line x1="60" y1="66" x2="820" y2="66" stroke="#262b33"/>
  <line x1="402" y1="80" x2="402" y2="368" stroke="#2d333e"/>

  <!-- fzf chrome: prompt, match count, keys -->
  <text x="88" y="96"><tspan fill="#7ee787">lemux&gt;</tspan></text>
  <rect x="142.6" y="84" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="88" y="118" fill="#8b949e" opacity="0.7">4/4</text>
  <text x="88" y="140" fill="#8b949e">enter: jump · ctrl-x: delete · esc: close</text>

  <!-- the selection, hopping between two side quests -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 22" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <rect x="72" y="173" width="316" height="21" rx="4" fill="#f5c24b" opacity="0.10"/>
    <text x="74" y="188" fill="#f5c24b" font-weight="bold">▌</text>
  </g>

  <!-- the tree -->
  <text x="88.0" y="166" fill="#c9d1d9">●</text>
  <text x="103.6" y="166" fill="#c9d1d9" textLength="78.0">japan trip</text>
  <text x="88.0" y="188" fill="#8b949e">├</text>
  <text x="95.8" y="188" fill="#8b949e">─</text>
  <text x="111.4" y="188" fill="#c9d1d9">●</text>
  <text x="127.0" y="188" fill="#c9d1d9" textLength="117.0">nozomi coverage</text>
  <text x="88.0" y="210" fill="#8b949e">│</text>
  <text x="111.4" y="210" fill="#8b949e">└</text>
  <text x="119.2" y="210" fill="#8b949e">─</text>
  <text x="134.8" y="210" fill="#8b949e">○</text>
  <text x="150.4" y="210" fill="#c9d1d9" textLength="93.6">hikari seats</text>
  <text x="88.0" y="232" fill="#8b949e">└</text>
  <text x="95.8" y="232" fill="#8b949e">─</text>
  <text x="111.4" y="232" fill="#8b949e">○</text>
  <text x="127.0" y="232" fill="#c9d1d9" textLength="101.4">nara or osaka</text>

  <!-- the preview: each branch's story, swapping with the selection -->
  <g>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  <text x="424.0" y="96" font-weight="bold" fill="#c9d1d9" textLength="117.0">nozomi coverage</text>
  <text x="556.6" y="96" fill="#c9d1d9" textLength="46.8">● idle</text>
  <text x="611.2" y="96" fill="#8b949e" textLength="148.2">· 2m ago · 1 branch</text>
  <text x="424.0" y="124" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ story so far ┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="146" fill="#f5c24b">⑂</text>
  <text x="439.6" y="146" fill="#c9d1d9" textLength="304.2">pinning down which bullet trains the JR</text>
  <text x="439.6" y="168" fill="#c9d1d9" textLength="304.2">pass actually covers on the Tokyo–Kyoto</text>
  <text x="439.6" y="190" fill="#c9d1d9" textLength="23.4">leg</text>
  <text x="424.0" y="216" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ branched on ┄┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="238" fill="#f5c24b">❝</text>
  <text x="439.6" y="238" fill="#8b949e" textLength="241.8">…Fushimi Inari at sunrise, then</text>
  <text x="439.6" y="260" fill="#8b949e" textLength="163.8">Arashiyama. Note: the</text>
  <rect x="609.2" y="246" width="121.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="611.2" y="260" fill="#f5c24b" textLength="117.0">JR Pass doesn't</text>
  <rect x="437.6" y="268" width="238.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="439.6" y="282" fill="#f5c24b" textLength="234.0">cover the Nozomi bullet trains</text>
  <text x="681.4" y="282" fill="#8b949e" textLength="78.0">— book the</text>
  <text x="439.6" y="304" fill="#8b949e" textLength="117.0">Hikari instead…</text>
  <text x="424.0" y="330" font-weight="bold" fill="#39c5cf">❯</text>
  <text x="439.6" y="330" fill="#8b949e">asked</text>
  <text x="494.2" y="330" fill="#c9d1d9" textLength="187.2">which trains can I take?</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  <text x="424.0" y="96" font-weight="bold" fill="#c9d1d9" textLength="93.6">hikari seats</text>
  <text x="533.2" y="96" fill="#8b949e" textLength="132.6">○ closed · 1h ago</text>
  <text x="424.0" y="124" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ story so far ┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="146" fill="#f5c24b">⑂</text>
  <text x="439.6" y="146" fill="#8b949e" textLength="304.2">pinning down which bullet trains the JR</text>
  <text x="439.6" y="168" fill="#8b949e" textLength="304.2">pass actually covers on the Tokyo–Kyoto</text>
  <text x="439.6" y="190" fill="#8b949e" textLength="23.4">leg</text>
  <text x="431.8" y="216" fill="#f5c24b">⑂</text>
  <text x="447.4" y="216" fill="#c9d1d9" textLength="288.6">chasing whether the hikari needs seat</text>
  <text x="447.4" y="238" fill="#c9d1d9" textLength="288.6">reservations in cherry-blossom season</text>
  <text x="424.0" y="264" fill="#8b949e" opacity="0.7" textLength="195.0">┄┄ branched on ┄┄┄┄┄┄┄┄┄┄</text>
  <text x="424.0" y="286" fill="#f5c24b">❝</text>
  <text x="439.6" y="286" fill="#8b949e" textLength="296.4">…with the pass you can ride the Hikari</text>
  <text x="439.6" y="308" fill="#8b949e" textLength="93.6">and Kodama —</text>
  <rect x="539.0" y="294" width="191.2" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="541.0" y="308" fill="#f5c24b" textLength="187.2">the Hikari reaches Kyoto</text>
  <rect x="437.6" y="316" width="175.6" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="439.6" y="330" fill="#f5c24b" textLength="171.6">about 15 minutes later</text>
  <text x="611.2" y="330" fill="#8b949e" textLength="78.0">, for free</text>
  <text x="424.0" y="356" font-weight="bold" fill="#39c5cf">❯</text>
  <text x="439.6" y="356" fill="#8b949e">asked</text>
  <text x="494.2" y="356" fill="#c9d1d9" textLength="218.4">do I need seat reservations?</text>
  </g>
</svg>
