<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 624" font-family="SFMono-Regular, Menlo, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c24b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ══════════ the main conversation ══════════ -->
  <g filter="url(#shadow)">
    <rect x="36" y="28" width="560" height="252" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <circle cx="58" cy="50" r="5.5" fill="#ff5f56"/>
  <circle cx="76" cy="50" r="5.5" fill="#ffbd2e"/>
  <circle cx="94" cy="50" r="5.5" fill="#27c93f"/>
  <text x="316" y="54" text-anchor="middle" font-size="11.5" fill="#8b949e">checkout page — the main quest</text>
  <line x1="36" y1="66" x2="596" y2="66" stroke="#262b33"/>

  <text x="64" y="96" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> why does my layout jump while loading?</text>

  <text x="64.0" y="126" fill="#c9d1d9" textLength="358.8">The product images have no width or height, so</text>
  <text x="64.0" y="148" fill="#c9d1d9" textLength="249.6">the browser can't reserve space.</text>
  <rect x="319.4" y="134" width="89.8" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="321.4" y="148" fill="#f5c24b" textLength="85.8">The webfont</text>
  <rect x="62.0" y="156" width="199.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="64.0" y="170" fill="#f5c24b" textLength="195.0">swap causes a second jump</text>
  <text x="266.8" y="170" fill="#c9d1d9" textLength="140.4">— that one needs a</text>
  <text x="64.0" y="192" fill="#c9d1d9" textLength="109.2">different fix…</text>

  <!-- the aside worth chasing -->
  <g>
    <text x="426" y="151" font-size="17" font-weight="bold" fill="#f5c24b" text-anchor="middle">!</text>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1; .4 0 .6 1"/>
  </g>

  <!-- …and the main thread carries on regardless -->
  <text x="64" y="240" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan> ok, adding the dimensions now</text>
  <rect x="314" y="228" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ══════════ the branch ══════════ -->
  <path d="M 162 186 C 162 290, 226 340, 382 368" fill="none" stroke="#f5c24b" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="161" y="292" width="104" height="28" rx="6" fill="#1d212a" stroke="#f5c24b" stroke-opacity="0.55"/>
  <text x="213" y="310" text-anchor="middle" fill="#f5c24b">branch it</text>

  <!-- ══════════ the side quest ══════════ -->
  <g filter="url(#shadow)">
    <rect x="340" y="372" width="470" height="218" rx="10" fill="#171922" stroke="#2d333e"/>
  </g>
  <polygon points="373,362 397,362 397,384 373,384 384,373" fill="#c9a227"/>
  <polygon points="727,362 703,362 703,384 727,384 716,373" fill="#c9a227"/>
  <rect x="395" y="356" width="310" height="32" rx="5" fill="#f5c24b"/>
  <text x="550" y="377" text-anchor="middle" font-weight="bold" font-size="13.5" letter-spacing="1" fill="#1c1710">◆ SIDE QUEST ACCEPTED ◆</text>

  <text x="368" y="424" fill="#c9d1d9"><tspan fill="#7ee787">&gt;</tspan></text>
  <text x="383.6" y="424" fill="#c9d1d9" textLength="15.6">Re</text>
  <rect x="405.0" y="410" width="261.4" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="407.0" y="424" fill="#f5c24b" textLength="257.4">"The webfont swap causes a second</text>
  <rect x="381.6" y="432" width="43.0" height="19" rx="3" fill="#f5c24b" opacity="0.16"/>
  <text x="383.6" y="446" fill="#f5c24b" textLength="39.0">jump"</text>
  <text x="422.6" y="446" fill="#c9d1d9" textLength="265.2">: which fix, and what does it cost</text>
  <text x="383.6" y="468" fill="#c9d1d9" textLength="23.4">me?</text>

  <text x="368.0" y="512" fill="#8b949e" textLength="343.2">font-display: optional. The tradeoff is that</text>
  <text x="368.0" y="534" fill="#8b949e" textLength="335.4">on a slow connection the webfont is skipped</text>
  <text x="368.0" y="556" fill="#8b949e" textLength="179.4">entirely for that visit</text>
  <rect x="553" y="544" width="8" height="15" fill="#8b949e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
